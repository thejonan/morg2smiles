name: morg2smiles
channels:
  - conda-forge
dependencies:
  - python=3.11
  # Pinned exactly, like pyproject.toml. Shards (standardisation, canonical
  # SMILES), training fingerprints and the oracle all come from RDKit, and a
  # different release can change which molecules survive and which bits a
  # molecule sets -- an exact-match oracle has no tolerance for either. Bump it
  # deliberately, in a commit, and rebuild the shards into fresh folders when
  # you do: the cached fp_unseen masks are keyed on the fingerprint config, not
  # on the RDKit version.
  - rdkit==2026.03.3
  - pytorch>=2.4
  - numpy
  - pandas
  - pyyaml
  - tqdm
  - click
  - matplotlib
  - pytest
  # Pinned to the version CI gates on, like pyproject's dev extra. `ruff format
  # --check` is a gate and its output changes between releases, so an unpinned
  # formatter here would let a fresh conda env disagree with CI about formatting
  # with no code change -- which is the failure the pin in pyproject.toml and
  # the one in the workflow both exist to prevent.
  - ruff=0.16.10
  - pip
